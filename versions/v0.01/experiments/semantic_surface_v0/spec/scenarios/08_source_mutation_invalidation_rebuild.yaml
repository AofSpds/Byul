    }
  ],
  "cases": [
    {
      "case_id": "invalidate_affected_rebuild_preserve_unrelated",
      "control_type": "PAIRED_CONTROL",
      "given": {
        "source_before": { "source_id": "S", "content_id": "B0" },
        "source_after": { "source_id": "S", "content_id": "B1", "successor_of": "B0" },
        "derived_outputs": [
          { "derived_id": "D", "depends_on": ["B0"], "state": "CURRENT" },
          { "derived_id": "U", "depends_on": ["OTHER0"], "state": "CURRENT" }
        ],
        "requested_output": "D",
        "original_source_must_remain_addressable": true
      },
      "when": {
        "operation": "apply_source_successor_and_query_derived",
        "request": "Serve D after S changes from B0 to B1, and report the state of unrelated U."
      },
      "allowed_outcomes": {
        "resolution": ["RESOLVED"],
        "decision": ["EXECUTE"],
        "recoverability": ["EXACT", "PARTIAL", "UNKNOWN"],
        "plan_status": ["SAFE_PLAN"]
      },
      "forbidden_behaviors": [
        "Serve D built from B0 as current after B1 becomes the requested source target.",
        "Rebuild D without recording its B1 source dependency and transformation evidence.",
        "Invalidate U without dependency or impact evidence.",
        "Overwrite B0 or relabel a lossy/partial rebuild as EXACT.",
        "Create an undisclosed duplicate source and treat it as authoritative."
      ],
      "unresolved_allowed": false,
      "required_observations": [
        {
          "id": "affected_derivation_staled",
          "requirement": "Mark D from B0 non-current before serving the post-mutation query.",
          "evidence_required": true
        },
        {
          "id": "derived_rebuilt_from_successor",
          "requirement": "Produce or select D rebuilt from B1 with source and transformation provenance.",
          "evidence_required": true
        },
        {
          "id": "rebuild_loss_disclosed",
          "requirement": "Report the supported recoverability class and disclose any loss; claim EXACT only with lossless evidence.",
          "evidence_required": true
        },
        {
          "id": "unrelated_output_preserved",
          "requirement": "Keep U current and show that no dependency path from B1/B0 to U was found.",
          "evidence_required": true
        },
        {
          "id": "predecessor_retained",
          "requirement": "Keep B0 addressable as predecessor evidence while B1 becomes the requested source target.",
          "evidence_required": true
        }
      ]
    }
  ]
