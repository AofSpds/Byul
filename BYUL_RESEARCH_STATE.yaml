promotion_guard:
  prohibited_shortcuts:
    - "same-model or same-lineage convergence"
    - "terminology repeated across documents"
    - "proposal recommendation"
    - "implementation test pass"
    - "a machine-readable status label"
    - "a cold reader finding one formulation easy to summarize"
  minimum_route:
    - "pre-registered candidate-neutral scenarios"
    - "positive and negative controls"
    - "hidden holdouts"
    - "simpler-control comparison"
    - "ablation and complexity/cost accounting"
    - "explicit Owner selection where required"
    - "independent validation where claimed"

non_goals:
  - "Do not duplicate the predecessor memory corpus as a second semantic source."
  - "Do not move or delete historical memory paths to improve readability."
  - "Do not infer production authorization from this file."
  - "Do not force UNKNOWN, OPEN, or NON_CONCLUSION into a selected answer."
