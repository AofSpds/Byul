classification_registry:
  OWNER_DIRECTION: >-
    An explicit Owner operating or research direction. It does not by itself prove
    a scientific claim or select an implementation.
  SURVIVING_CONSTRAINT_CANDIDATE: >-
    A narrower obligation that survived the current proposal/adversarial round.
    It remains attackable and is not a validated invariant.
  WORKING_HYPOTHESIS: >-
    A research hypothesis retained for testing, not a canonical truth.
  COMPETITIVE_CANDIDATE: >-
    A candidate implementation or control that must compete under shared evidence
    and cost gates.
  OPEN: >-
    An unresolved question for which UNKNOWN or NON_CONCLUSION is acceptable.
  NON_CLAIM: >-
    A boundary against over-reading current evidence. It is not a positive theory.
  UNDER_CHALLENGE: >-
    A previously prominent formulation that remains directly attackable and has
    not earned canonical status.

